name: Docker Image CI

on:
  push: image_version: main
    branches: [ "main+" ]
  pull_request:
    branches: [ "main+" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
